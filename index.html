<body>

```
<header>
    <h1>Bubble Sort</h1>
    <p>Organizando números</p>
</header>

<main>

    <section class="card">

        <h2>Lista de números</h2>

        <div class="numeros"></div>

        <button id="ordenar-btn">
            Ordenar números
        </button>

        <p class="mensagem"></p>

    </section>

    <section class="card explicacao">

        <h2>Como funciona?</h2>

        <p>
            O Bubble Sort compara dois números vizinhos
            e troca suas posições quando estão na ordem errada.
        </p>

        <div class="comparacao">

            <div class="numero destaque">5</div>

            <span>↔</span>

            <div class="numero destaque">2</div>

        </div>

        <p>
            Como 5 é maior que 2, eles trocam de posição.
        </p>

    </section>

</main>

<script src="script.js"></script>
```

</body>

</html>
